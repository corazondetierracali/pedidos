<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de conexión · Corazón de Tierra</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; background: #EFEDE6; color: #26282f; }
  main { max-width: 480px; margin: 0 auto; padding: 32px 16px; text-align: center; }
  .caja { border-radius: 16px; padding: 24px 16px; margin-top: 16px; background: #fff; border: 1px solid #dcd8cc; }
  .ok { background: #2B5615; color: #fff; }
  .mal { background: #a33b2b; color: #fff; }
  b { display: block; font-size: 22px; margin-bottom: 8px; }
</style>
</head>
<body>
<main>
  <h1 style="color:#2B5615">Prueba de conexión</h1>
  <div class="caja" id="r"><b>Consultando…</b>Un momento.</div>
</main>
<script>
  var URL_APP = "https://script.google.com/macros/s/AKfycbzUwuO3Fi0CjtldIwJ4CEdKZPK61EsmP8bYFTL5YhTzdDWJVcxjGFVmS3WZ6OGWq2DkUw/exec";
  var r = document.getElementById("r");
  fetch(URL_APP + "?api=inicio", { credentials: "omit" })
    .then(function (res) { return res.json(); })
    .then(function (d) {
      r.className = "caja ok";
      r.innerHTML = "<b>\u2705 FUNCIONA</b>";
      r.appendChild(document.createTextNode(d.abierto ? "Pedidos abiertos. Entrega: " + d.entrega : (d.motivo || "Pedidos cerrados.")));
    })
    .catch(function (e) {
      r.className = "caja mal";
      r.innerHTML = "<b>\u274C NO FUNCIONA</b>";
      r.appendChild(document.createTextNode(String(e)));
    });
</script>
</body>
</html>
